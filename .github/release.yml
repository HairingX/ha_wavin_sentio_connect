# How GitHub groups a release's notes: each pull request by its labels.
changelog:
  exclude:
    labels:
      - skip-changelog
      # CI, tooling and documentation changes do not change what a user installs.
      - chore
  categories:
    - title: 🛠 Breaking Changes
      labels:
        - breaking-change
    - title: 🚀 Features
      labels:
        - feature request
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
        - bugfix
    - title: 📦 Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
